# 独立 workspace —— 不并入 qi-runtime，避免把 rusqlite/reqwest 那棵依赖树拖进来。
#
# 这个 crate 自己几乎没有代码：绝大部分源文件是用 #[path] 从 ../src 原样编进来的
# （字符串 / JSON / 列表 / 哈希表 / 字节切片 / 数学 / 时间 / 闭包 / 反射 / 正则 / 加密…），
# 一份源码两个目标。只有跟宿主强相关的几件是这里手写的：打印、分配、goroutine
# （单线程里就地跑）、Future（同步版）、异常（wasi libc 没有 setjmp，先只能 abort）。
[workspace]

[package]
name = "qi-runtime-wasm"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Qi 语言 WebAssembly 运行时（wasm32-wasip1）—— 复用主运行时的纯计算模块"

[lib]
name = "qi_runtime_wasm"
crate-type = ["staticlib"]

[dependencies]
# 版本与 ../Cargo.toml 对齐，语义才一致（serde_json 必须 preserve_order：磁带键靠它）
serde_json = { version = "1.0.107", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
dashmap = "6.1"
# 标准库.哈希表：entry_ref 单次哈希写入 + ahash 随机种子（抗 HashDoS）。
# 两者本来就在依赖树里（indexmap / dashmap 带进来），wasm32-wasip1 可编。
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
ahash = "0.8"
chrono = { version = "0.4.38", features = ["serde"] }
libc = "0.2.158"
regex = "1.10.0"
sha2 = "0.10.8"
md-5 = "0.10.6"
base64 = "0.22.0"
rand = "0.8"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
flate2 = "1.0"
once_cell = "1.21.3"
lazy_static = "1.5"
hmac = "0.12.1"
thiserror = "1.0.69"
num_cpus = "1.16.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
