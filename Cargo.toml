# 独立 workspace（暂不并入父 workspace）—— 便于单独构建 + zig 交叉构建验证
[workspace]

[package]
name = "qi-runtime"
version = "2026.8.18-1"
edition = "2021"
authors = ["Qi Language Team"]
license = "MIT"
description = "Qi 语言运行时 —— 编进生成程序的 FFI 符号（IO/网络/LLM/DB/异步…）。无 LLVM，纯 Rust+C，可 zig 交叉编译。"

[lib]
name = "qi_runtime"
crate-type = ["staticlib", "rlib"]

[features]
default = ["runtime-rc-string", "db-postgres", "db-mysql", "redis", "grpc"]
runtime-rc-string = []
# 桌面 GUI：把 qi-gui（tao/egui/winit/softbuffer 等）编进 libqi_runtime.a，
# 并置 has_gui。默认关闭 —— 保持运行时轻量、可 zig 交叉编译（GUI 非交叉目标）。
# 桌面构建 GUI 可用的运行时：cargo build --release --features gui
gui = ["dep:qi-gui"]
# 数据库后端：默认开。只连 SQLite 的场景可 --no-default-features 关掉，
# 少编两棵网络驱动树、二进制也小一圈（见 qi-web/docs/多数据库设计.md 风险表）。
db-postgres = ["dep:postgres", "dep:postgres-types", "dep:r2d2"]
db-mysql = ["dep:mysql", "dep:r2d2"]
# Redis：默认开。跟 SQL 后端共用 r2d2 池。关掉它 标准库.Redis 的调用会
# 在链接期报 undefined symbol —— 是刻意的，比运行时才发现「连不上」好。
redis = ["dep:redis", "dep:r2d2"]
# gRPC / protobuf：默认开。protox 在**运行时**编译 .proto（不依赖 protoc
# 二进制），prost-reflect 提供 DynamicMessage 做 JSON ↔ protobuf 互转。
# 选动态描述符而不是编译期代码生成：qi 没有 build.rs 那一环，而且这样
# qi 侧继续只跟 JSON 打交道，跟数据库层「JSON 当细腰」是同一个选择。
grpc = ["dep:protox", "dep:protox-parse", "dep:prost-reflect", "dep:prost", "dep:prost-types"]

[build-dependencies]
cc = "1.0"

[dependencies]
# 桌面 GUI 静态库（可选）：tao 老 API + egui 控件层。仅 --features gui 时编入。
qi-gui = { path = "../qi-gui", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order：JSON 对象保持插入序（parse→stringify 往返不打乱原文档键序，
# 输出跨运行确定）。底层 IndexMap。
serde_json = { version = "1.0.107", features = ["preserve_order"] }
# MCP 工具/资源/提示注册表按注册序迭代；serde feature 顺带给 configparser 的
# IndexMap 提供 Serialize/Deserialize（feature 统一）
indexmap = { version = "2", features = ["serde"] }

# HTTP/TLS —— 纯 Rust（rustls），无系统 openssl/Security.framework
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2"] }
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# 客户端 TLS 的根证书：编进二进制，不读系统钥匙串 ——
# 交叉编译出的 Linux 二进制要能在最小化容器里直接跑
webpki-roots = "1"
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes = "1"
http = "1"

glob = "0.3.1"
walkdir = "2.4.0"
dirs = "5.0.1"

thiserror = "1.0.69"
anyhow = "1.0.86"
once_cell = "1.21.3"
lazy_static = "1.5"

tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
crossbeam = "0.8.4"
dashmap = "6.1"
libc = "0.2.158"
num_cpus = "1.16.0"
chrono = { version = "0.4.38", features = ["serde"] }
regex = "1.10.0"

sha2 = "0.10.8"
sha1 = "0.10.6"
md-5 = "0.10.6"
base64 = "0.22.0"
hmac = "0.12.1"
rand = "0.8"

clap = { version = "4.5.50", features = ["derive"] }
toml = "0.8.8"
ini = "1.3"
# indexmap feature：INI 段/键保持文件出现序 —— 读回 JSON 键序确定且忠实原文档
configparser = { version = "3.1", features = ["indexmap"] }
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4.20"
# PostgreSQL / MySQL：都选**同步**驱动。异步驱动（sqlx/tokio-postgres 裸用）会把
# async 传染到每个 FFI 上（block_on + runtime 句柄），与现有阻塞式数据库 FFI 打架。
postgres = { version = "0.19", optional = true }
postgres-types = { version = "0.2", optional = true }
# default-rust 而非 default：走 flate2 纯 Rust 后端、不引 native-tls/OpenSSL ——
# 保住 zig 交叉编译到 Linux 的能力。
mysql = { version = "28", default-features = false, features = ["default-rust"], optional = true }
# 连接池。只用 r2d2 核心（一个 ManageConnection 实现），不用 r2d2_postgres /
# r2d2_mysql —— 我们池化的是统一后的 `后端` 枚举，用官方适配器反而要按后端
# 切成两个类型不同的池。纯 Rust，不妨碍 zig 交叉编译。
r2d2 = { version = "0.8", optional = true }
redis = { version = "1.5.0", features = ["r2d2", "tls-rustls", "tls-rustls-webpki-roots"], optional = true }
protox = { version = "0.9.1", optional = true }
prost-reflect = { version = "0.16.5", features = ["serde"], optional = true }
prost = { version = "0.14.4", optional = true }
prost-types = { version = "0.14.4", optional = true }
protox-parse = { version = "0.9.0", optional = true }

[dev-dependencies]
# filesystem.rs 测试用（预先存在的缺口：tests 引用了 tempfile 但未声明）
tempfile = "3"
